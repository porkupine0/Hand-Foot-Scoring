<title>Hand &amp; Foot Scorekeeper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;600;700&display=swap" crossorigin>
<style>
:root{
  --bg:#f4f1f4; --surface:#ffffff; --surface-2:#ece6ec; --ink:#221a26; --muted:#6b5f70; --line:#ddd3dd;
  --accent:#a3203a; --accent-ink:#ffffff; --gold:#a8780f; --good:#2f7d4f;
  --lead:#f8e8eb; --lead-line:#a3203a; --warn:#a4470f; --warn-bg:#fdf0e4; --err:#b3261e; --err-bg:#fdeceb;
  --shadow:0 1px 2px rgba(34,26,38,.06),0 6px 18px rgba(34,26,38,.06);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#16121a; --surface:#211b26; --surface-2:#2b2331; --ink:#f1eaf2; --muted:#a898ab; --line:#3a2f40;
  --accent:#f0708a; --accent-ink:#16121a; --gold:#e4b64c; --good:#6cc996;
  --lead:#3a1c26; --lead-line:#f0708a; --warn:#f0a060; --warn-bg:#3b2716; --err:#f28b82; --err-bg:#3b1e1c;
  --shadow:none;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#16121a; --surface:#211b26; --surface-2:#2b2331; --ink:#f1eaf2; --muted:#a898ab; --line:#3a2f40;
  --accent:#f0708a; --accent-ink:#16121a; --gold:#e4b64c; --good:#6cc996;
  --lead:#3a1c26; --lead-line:#f0708a; --warn:#f0a060; --warn-bg:#3b2716; --err:#f28b82; --err-bg:#3b1e1c;
  --shadow:none;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.45 "Figtree",system-ui,sans-serif;padding-inline:16px;padding-block:18px 48px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:"Bricolage Grotesque","Figtree",system-ui,sans-serif;margin:0;text-wrap:balance}
h1{font-size:30px;font-weight:800;letter-spacing:-.01em}
h2{font-size:19px;font-weight:600}
h3{font-size:18px;font-weight:800;overflow-wrap:anywhere}
.num{font-variant-numeric:tabular-nums}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px}
.suits{display:flex;gap:6px;font-size:18px;line-height:1;margin-top:4px}
.suits .r{color:var(--accent)} .suits .b{color:var(--ink)}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
button,select{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 14px;font-weight:600}
button:disabled{opacity:.4;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-size:17px;padding:14px}
.ghost{background:transparent}
.small{padding:6px 10px;font-size:14px}
.danger{color:var(--err);border-color:var(--err)}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
input[type=text],select{font:inherit;width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.hint{font-size:14px;color:var(--muted);margin:0}
.stepper{display:flex;align-items:center;gap:14px}
.stepper button{width:46px;height:46px;font-size:22px;padding:0}
.stepper .count{font-family:"Bricolage Grotesque",sans-serif;font-size:34px;font-weight:800;min-width:40px;text-align:center}
.teamset{display:flex;flex-direction:column;gap:8px;padding-top:12px;border-top:1px solid var(--line)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}
label.lbl{font-size:13px;font-weight:700;color:var(--muted)}

/* standings */
.teams{display:flex;flex-direction:column;gap:8px}
.team{display:grid;grid-template-columns:1fr auto;align-items:center;gap:4px 12px;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.team.lead{background:var(--lead);border-color:var(--lead-line)}
.tname{font-weight:800;font-size:17px;overflow-wrap:anywhere}
.tplayers{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.total{font-family:"Bricolage Grotesque",sans-serif;font-size:30px;font-weight:800;text-align:right;grid-row:1 / 3;grid-column:2}
.gap{font-size:13px;font-weight:700;color:var(--muted)}
.team.lead .gap{color:var(--accent)}

/* round info */
.info{display:flex;flex-direction:column;gap:10px;padding:14px 16px;border-radius:14px;background:var(--surface-2)}
.infotop{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline}
.meld{font-family:"Bricolage Grotesque",sans-serif;font-size:26px;font-weight:800;color:var(--accent)}
.check{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:14px}
.check li{display:flex;gap:8px;align-items:flex-start}
.check li::before{content:"";flex:none;width:14px;height:14px;margin-top:3px;border:2px solid var(--accent);border-radius:4px}

/* final round banner */
.final{border:2px solid var(--accent);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:4px;background:var(--surface)}
.final .big{font-family:"Bricolage Grotesque",sans-serif;font-size:26px;font-weight:800;text-wrap:balance}

/* entry */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 14px;border-radius:999px;font-size:15px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tpanel{display:flex;flex-direction:column;gap:10px;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.thead{display:flex;align-items:baseline;gap:10px}
.preview{font-family:"Bricolage Grotesque",sans-serif;font-size:24px;font-weight:800;margin-left:auto;white-space:nowrap}
.field{display:grid;grid-template-columns:1fr auto;align-items:center;gap:4px 10px}
.field .flbl{font-weight:700}
.field .fsub{font-size:12px;color:var(--muted);grid-column:1}
.mini{display:flex;align-items:center;gap:4px;grid-row:1 / 3;grid-column:2}
.mini button{width:40px;height:40px;padding:0;font-size:20px}
.mini .v{min-width:30px;text-align:center;font-weight:800;font-size:19px}
.numin{width:96px !important;text-align:right;font-size:19px;font-weight:700;grid-row:1 / 3;grid-column:2}
.field.off{opacity:.45}
.bd{font-size:13px;color:var(--muted);line-height:1.5}
.warn{background:var(--warn-bg);color:var(--warn);padding:8px 10px;border-radius:8px;font-size:13px;font-weight:700}
.err{background:var(--err-bg);color:var(--err);padding:10px 12px;border-radius:10px;font-weight:600;font-size:14px}

/* history */
.rcard{display:flex;flex-direction:column;gap:8px;padding-block:12px;border-top:1px solid var(--line)}
.rcard:first-of-type{border-top:0;padding-top:0}
.rhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.rmeta{font-size:13px;color:var(--muted)}
.rrow{display:grid;grid-template-columns:1fr auto;gap:2px 10px}
.rrow .rt{font-weight:700;overflow-wrap:anywhere}
.rrow .rs{font-weight:800;text-align:right}
.rrow .bd{grid-column:1 / 3}
.pos{color:var(--good)} .neg{color:var(--err)}
.sev{color:var(--gold);font-weight:700}

.banner{background:var(--accent);color:var(--accent-ink);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px}
.banner h2{font-size:26px;font-weight:800}
.banner button{background:var(--surface);color:var(--ink);border-color:var(--surface)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btnrow>*{flex:1}
details.rules{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 16px}
details.rules summary{cursor:pointer;font-weight:700}
.rulegrid{display:grid;grid-template-columns:1fr auto;gap:4px 16px;font-size:14px;margin-top:10px}
.rulegrid dt{color:var(--muted)} .rulegrid dd{margin:0;font-weight:700;text-align:right}
.rulelist{font-size:14px;margin:10px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:4px}

/* stats */
.hl{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.aw{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--bg);display:flex;flex-direction:column;gap:2px}
.aw .an{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);font-weight:800}
.aw .ah{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:18px;overflow-wrap:anywhere}
.aw .ad{font-size:13px;color:var(--muted)}
.stwrap{overflow-x:auto}
table.st{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:14px}
table.st th,table.st td{padding:7px 6px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
table.st th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
table.st th:first-child,table.st td:first-child{text-align:left}
@media (max-width:380px){.hl{grid-template-columns:1fr}}

/* hx:css:start */
/* game history (shared) */
.hx-hbtns{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;align-items:center}
.hx{display:flex;flex-direction:column;gap:18px;--hx-acc:var(--accent,var(--gold,var(--amber,#8a5a00)));--hx-bad:var(--err,var(--red,var(--bad,#b3261e)))}
.hx-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.hx-top h1{margin:0}
.hx .stwrap{overflow-x:auto}
.hx table.st{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:14px}
.hx table.st th,.hx table.st td{padding:7px 6px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:top}
.hx table.st th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.hx table.st th:first-child,.hx table.st td:first-child{text-align:left}
.hx select{font:inherit;width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.hx-awards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.hx-award{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--bg);display:flex;flex-direction:column;gap:2px;min-width:0}
.hx-an{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--hx-acc);font-weight:800}
.hx-aw{font-weight:800;font-size:18px;overflow-wrap:anywhere}
.hx-ad{font-size:13px;color:var(--muted)}
.hx-log{display:flex;flex-direction:column}
.hx-game{display:flex;flex-direction:column;gap:6px;padding-block:12px;border-top:1px solid var(--line)}
.hx-game:first-child{border-top:0;padding-top:0}
.hx-meta{display:flex;flex-direction:column;gap:2px}
.hx-scores{font-size:15px;overflow-wrap:anywhere}
.hx-win{color:var(--hx-acc);font-weight:700}
.hx-tag{display:inline-block;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;border:1px solid currentColor;border-radius:6px;padding:0 5px;margin-right:4px}
.hx-btns>*{flex:0 0 auto}
.hx-card{display:flex;flex-direction:column;gap:8px;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.hx-sc td{line-height:1.25}
.hx table.hx-sc th{white-space:normal;min-width:48px}
.hx table.hx-sc th:first-child{min-width:0}
.hx-run{display:block;font-size:11px;color:var(--muted);font-weight:400}
.hx-tot td{font-weight:800;border-bottom:0}
.hx-won{color:var(--hx-acc)}
.hx-nudge{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--hx-acc);border-radius:12px;background:var(--surface);font-size:14px;font-weight:600}
.hx-link{border:0;background:none;padding:0;font:inherit;font-weight:700;color:var(--hx-acc);text-decoration:underline;text-underline-offset:2px;cursor:pointer}
.hx .danger{color:var(--hx-bad);border-color:var(--hx-bad)}
.hx-saved{display:flex;align-items:center;justify-content:space-between;gap:8px 12px;flex-wrap:wrap}
.hx-saved>button{flex:0 0 auto}
.hx-paste{font:inherit;font-size:16px;width:100%;box-sizing:border-box;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);resize:vertical}
/* hx:css:end */
</style>
<style>body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>

<div class="wrap" id="app"></div>

<script>
const KEY = "hand-foot-scorekeeper-v1";
const MELDS = [90, 120, 150, 180];
const V = { clean:500, dirty:300, sevens:1500, red3:-500 };

const blankSetup = () => ({ count:2, teams:[0,1,2].map(()=>({name:"", p:["",""]})), firstDealer:0 });
let state = load() || { phase:"setup", setup:blankSetup(), teams:[], firstDealer:0, rounds:[] };
let entry = null;
let confirmKey = null, confirmTimer = null;

function load(){ try{ const s = localStorage.getItem(KEY); return s ? JSON.parse(s) : null; }catch(e){ return null; } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = n => Math.abs(n).toLocaleString("en-US");
const signed = n => (n < 0 ? "−" : "+") + fmt(n);
const total = n => (n < 0 ? "−" : "") + fmt(n);

// Seating alternates teams: A1, B1, (C1), A2, B2, (C2)
function seats(teams){ const s=[]; for (let k=0;k<2;k++) teams.forEach((t,ti)=>s.push({ti,k})); return s; }
function playerName(teams, ti, k){ return (teams[ti].p[k]||"").trim() || `Partner ${k+1}`; }
function teamName(teams, ti){ return (teams[ti].name||"").trim() || `Team ${ti+1}`; }
function dealerLabel(r){
  const s = seats(state.teams), d = s[(state.firstDealer + r) % s.length];
  return `${esc(playerName(state.teams,d.ti,d.k))} <span class="rmeta">(${esc(teamName(state.teams,d.ti))})</span>`;
}

function scoreTeam(round, i){
  const t = round.t[i];
  const books = t.clean*V.clean + t.dirty*V.dirty + t.sevens*V.sevens;
  const table = t.table;
  const hand = -t.hand;
  const redApplies = round.went >= 0 && round.went !== i;
  const red = redApplies ? t.red3*V.red3 : 0;
  return { books, table, hand, red, redApplies, total: books + table + hand + red };
}
function breakdown(round, i){
  const s = scoreTeam(round, i), t = round.t[i];
  const parts = [];
  const bookBits = [];
  if (t.clean) bookBits.push(`${t.clean} clean`);
  if (t.dirty) bookBits.push(`${t.dirty} dirty`);
  if (t.sevens) bookBits.push(`<span class="sev">${t.sevens} clean 7s</span>`);
  parts.push(`Books ${signed(s.books)}${bookBits.length?` (${bookBits.join(", ")})`:""}`);
  parts.push(`Table ${signed(s.table)}`);
  parts.push(`Hand &amp; foot ${s.hand===0?"0":signed(s.hand)}`);
  if (s.red) parts.push(`<span class="neg">Red 3s ${signed(s.red)}</span>`);
  return parts.join(" · ");
}
function totals(){
  const t = state.teams.map(()=>0);
  state.rounds.forEach(r => t.forEach((_,i)=> t[i] += scoreTeam(r,i).total));
  return t;
}
const over = () => state.rounds.length >= MELDS.length;

function confirmThen(key, fn){
  if (confirmKey === key){ clearTimeout(confirmTimer); confirmKey = null; fn(); return; }
  confirmKey = key; render();
  clearTimeout(confirmTimer);
  confirmTimer = setTimeout(()=>{ confirmKey = null; render(); }, 3500);
}

// Keep the screen on while a game is being played.
let wakeLock = null, wakePending = false;
async function keepAwake(){
  const want = state.phase === "play" && document.visibilityState === "visible";
  try{
    if (want && !wakeLock && !wakePending && navigator.wakeLock){
      wakePending = true;
      wakeLock = await navigator.wakeLock.request("screen");
      wakeLock.addEventListener("release", () => { wakeLock = null; });
    } else if (!want && wakeLock){ const w = wakeLock; wakeLock = null; await w.release(); }
  }catch(e){ wakeLock = null; }
  wakePending = false;
}
document.addEventListener("visibilitychange", keepAwake);

function render(){
  const app = document.getElementById("app");
  const focusId = document.activeElement && document.activeElement.id;
  app.innerHTML = state.phase === "setup" ? setupView() : playView();
  if (focusId){ const el = document.getElementById(focusId); if (el) el.focus(); }
  keepAwake();
}

function header(extra=""){
  return `<div class="brand"><div><h1>Hand &amp; Foot</h1>
    <div class="suits" aria-hidden="true"><span class="b">♠</span><span class="r">♥</span><span class="r">♦</span><span class="b">♣</span></div></div><div class="hx-hbtns">${hx.button()}${extra}</div></div>`;
}

function rulesCard(){
  return `<details class="rules"><summary>House rules</summary>
    <dl class="rulegrid num">
      <dt>Jokers and 2s</dt><dd>50</dd><dt>Aces</dt><dd>20</dd><dt>10 through King</dt><dd>10</dd>
      <dt>4 through 9</dt><dd>5</dd><dt>Black 3s left in hand</dt><dd>−5</dd>
      <dt>Red 3s, when the other team goes out</dt><dd>−500</dd>
      <dt>Clean book</dt><dd>500</dd><dt>Dirty book</dt><dd>300</dd><dt>Clean book of 7s</dt><dd>1,500</dd>
    </dl>
    <ul class="rulelist">
      <li>Opening meld: 90, 120, 150, 180 for rounds 1 to 4.</li>
      <li>To go out: 2 dirty books and 1 clean book, and both partners in their foot.</li>
      <li>Dirty books need more naturals than wilds. No books of all wilds.</li>
      <li>3s can't be melded.</li>
      <li>Cards in books and unfinished melds count for you. Cards left in hand and foot count against you.</li>
      <li>No bonus for going out. Highest total after 4 rounds wins. Ties stand.</li>
    </ul></details>`;
}

function setupView(){
  const su = state.setup;
  const draftTeams = su.teams.slice(0, su.count);
  const s = seats(draftTeams);
  if (su.firstDealer >= s.length) su.firstDealer = 0;
  let teamsHtml = "";
  for (let i=0;i<su.count;i++){
    const t = su.teams[i];
    teamsHtml += `<div class="teamset">
      <label class="lbl" for="tname-${i}">Team ${i+1}</label>
      <input type="text" id="tname-${i}" data-tname="${i}" placeholder="Team ${i+1} name" value="${esc(t.name)}" maxlength="20" autocomplete="off">
      <div class="pair">
        <input type="text" id="p-${i}-0" data-p="${i}-0" placeholder="Partner 1" value="${esc(t.p[0])}" maxlength="16" autocomplete="off" aria-label="Team ${i+1} partner 1">
        <input type="text" id="p-${i}-1" data-p="${i}-1" placeholder="Partner 2" value="${esc(t.p[1])}" maxlength="16" autocomplete="off" aria-label="Team ${i+1} partner 2">
      </div></div>`;
  }
  const opts = s.map((x,idx)=>`<option value="${idx}" ${idx===su.firstDealer?"selected":""}>${esc(playerName(draftTeams,x.ti,x.k))} (${esc(teamName(draftTeams,x.ti))})</option>`).join("");
  return header() + `
  <div class="panel">
    <div class="eyebrow">Teams of two</div>
    <div class="stepper">
      <button id="minus" data-act="count" data-d="-1" aria-label="Fewer teams" ${su.count<=2?"disabled":""}>−</button>
      <span class="count num">${su.count}</span>
      <button id="plus" data-act="count" data-d="1" aria-label="More teams" ${su.count>=3?"disabled":""}>+</button>
      <p class="hint grow">teams, ${su.count*2} players</p>
    </div>
    ${teamsHtml}
    <div class="teamset">
      <label class="lbl" for="first-dealer">First dealer</label>
      <select id="first-dealer">${opts}</select>
      <p class="hint">Deal passes left each round. Seats alternate teams.</p>
    </div>
    <button class="primary" data-act="start" id="start">Start game</button>
  </div>` + rulesCard();
}

function playView(){
  const t = totals(), done = over(), hasScores = state.rounds.length > 0;
  const max = Math.max(...t);
  const order = t.map((v,i)=>i).sort((a,b)=>t[b]-t[a]);
  const sorted = order.map(i=>t[i]);
  const second = sorted.length > 1 ? sorted[1] : max;
  const leaders = state.teams.map((_,i)=>i).filter(i=>t[i]===max);

  let top = "";
  if (done){
    const names = leaders.map(i=>esc(teamName(state.teams,i)));
    const headline = leaders.length > 1 ? `Tie game: ${names.join(" &amp; ")} at ${total(max)}` : `${names[0]} win${/s$/i.test(names[0])?"":"s"} with ${total(max)}`;
    const margin = leaders.length > 1 ? "" : `<div>by ${fmt(max - second)} points</div>`;
    top = `<div class="banner"><div class="eyebrow" style="color:inherit;opacity:.85">Game over · 4 rounds</div>
      <h2>${headline}</h2>${margin}
      ${hx.saved()}
      <div class="btnrow"><button data-act="rematch" id="rematch">Rematch, same teams</button><button data-act="newsetup" id="newsetup2">New teams</button></div></div>`;
  } else if (state.rounds.length === MELDS.length - 1){
    const msg = leaders.length > 1 ? "All square going into the last hand" : `${esc(teamName(state.teams,leaders[0]))} lead${/s$/i.test(teamName(state.teams,leaders[0]))?"":"s"} by ${fmt(max - second)}`;
    top = `<div class="final"><div class="eyebrow" style="color:var(--accent)">Final round</div><div class="big num">${msg}</div></div>`;
  }

  const teamsHtml = order.map(i => {
    const lead = hasScores && t[i] === max;
    let gap = "";
    if (hasScores){
      if (lead) gap = leaders.length > 1 ? "Tied for the lead" : `Leads by ${fmt(max - second)}`;
      else gap = `${fmt(max - t[i])} behind`;
    }
    return `<div class="team ${lead?"lead":""}">
      <div class="tname">${esc(teamName(state.teams,i))}</div>
      <div class="total num">${total(t[i])}</div>
      <div><div class="tplayers">${esc(playerName(state.teams,i,0))} &amp; ${esc(playerName(state.teams,i,1))}</div>${gap?`<div class="gap num">${gap}</div>`:""}</div>
    </div>`;
  }).join("");

  // Next round info + entry
  let roundBlock = "";
  const rIdx = entry && entry.editing != null ? entry.editing : state.rounds.length;
  if (entry || !done){
    roundBlock = `<div class="info">
      <div class="infotop"><span class="eyebrow">Round ${rIdx+1} of 4</span><span>Opening meld <span class="meld num">${MELDS[rIdx]}</span></span><span class="grow"></span><span>Dealer: <b>${dealerLabel(rIdx)}</b></span></div>
      <ul class="check"><li>2 dirty books</li><li>1 clean book</li><li>Both partners in their foot</li></ul>
    </div>`;
  }
  if (entry) roundBlock += entryView(rIdx);
  else if (!done) roundBlock += `<button class="primary" data-act="newRound" id="newRound">Score round ${rIdx+1}</button>`;

  // History
  let history = "";
  if (hasScores){
    const running = state.teams.map(()=>0);
    const cards = state.rounds.map((r,ri) => {
      const wentTxt = r.went >= 0 ? `${esc(teamName(state.teams,r.went))} went out` : "Nobody went out";
      const rows = state.teams.map((_,i) => {
        const s = scoreTeam(r,i); running[i] += s.total;
        return `<div class="rrow"><span class="rt">${esc(teamName(state.teams,i))}</span><span class="rs num ${s.total<0?"neg":""}">${signed(s.total)}</span>
          <div class="bd num">${breakdown(r,i)} · <b>Total ${total(running[i])}</b></div></div>`;
      }).join("");
      return `<div class="rcard"><div class="rhead"><button class="small" id="edit-${ri}" data-act="edit" data-i="${ri}">Round ${ri+1}</button>
        <span class="rmeta">${MELDS[ri]} meld · Dealer ${dealerLabel(ri)} · ${wentTxt}</span></div>${rows}</div>`;
    }).join("");
    history = `<div class="panel">
      <div class="row"><h2 class="grow">Rounds</h2><button class="small" data-act="undo" id="undo">${confirmKey==="undo"?"Tap to confirm":"Undo last"}</button></div>
      <div>${cards}</div>
      <p class="hint">Tap a round to fix its scores.</p>
    </div>`;
  }

  const reset = `<button class="small ghost" data-act="newgame" id="newgame">${confirmKey==="new"?"Tap to confirm":"New game"}</button>`;
  return header(reset) + top + `<div class="teams">${teamsHtml}</div>` + roundBlock + history + statsView() + rulesCard() +
    `<p class="hint">Every game is saved in History on this device. Tap History to see past games. The screen stays on while you play.</p>`;
}

function stepField(i, f, label, sub, cls=""){
  const v = entry.t[i][f];
  return `<div class="field ${cls}"><span class="flbl">${label}</span><span class="fsub">${sub}</span>
    <span class="mini"><button id="dec-${f}-${i}" data-act="step" data-t="${i}" data-f="${f}" data-d="-1" aria-label="Fewer ${label}" ${v<=0?"disabled":""}>−</button>
    <span class="v num">${v}</span>
    <button id="inc-${f}-${i}" data-act="step" data-t="${i}" data-f="${f}" data-d="1" aria-label="More ${label}">+</button></span></div>`;
}
function entryRound(){
  return { went: entry.went == null ? -1 : entry.went, t: entry.t.map(x => ({ clean:x.clean, dirty:x.dirty, sevens:x.sevens, red3:x.red3,
    table: /^\d+$/.test(x.table.trim()) ? parseInt(x.table,10) : 0, hand: /^\d+$/.test(x.hand.trim()) ? parseInt(x.hand,10) : 0 })) };
}
function redNote(i){
  if (entry.went == null) return "−500 each if the other team goes out";
  if (entry.went === -1) return "Nobody went out, so these don't count";
  if (entry.went === i) return "Your team went out, so these don't count";
  return "−500 each";
}
function booksWarning(i){
  if (entry.went !== i) return "";
  const x = entry.t[i];
  if (x.dirty >= 2 && (x.clean + x.sevens) >= 1) return "";
  return "Going out needs 2 dirty books and 1 clean book. Check the book counts.";
}
function entryView(rIdx){
  const r = entryRound();
  const chips = state.teams.map((_,i)=>`<button class="chip" id="went-${i}" data-act="went" data-i="${i}" aria-pressed="${entry.went===i}">${esc(teamName(state.teams,i))}</button>`).join("") +
    `<button class="chip" id="went-none" data-act="went" data-i="-1" aria-pressed="${entry.went===-1}">Nobody</button>`;
  const panels = state.teams.map((_,i) => {
    const s = scoreTeam(r,i), x = entry.t[i], w = booksWarning(i);
    const redOff = entry.went != null && (entry.went === -1 || entry.went === i);
    return `<div class="tpanel">
      <div class="thead"><h3>${esc(teamName(state.teams,i))}</h3><span class="preview num" id="pv-${i}">${signed(s.total)}</span></div>
      ${stepField(i,"clean","Clean books","500 each")}
      ${stepField(i,"dirty","Dirty books","300 each")}
      ${stepField(i,"sevens","Clean 7s books","1,500 each")}
      <div class="field"><label class="flbl" for="table-${i}">Points on the table</label><span class="fsub">Every card in books and melds</span>
        <input type="text" class="numin" inputmode="numeric" pattern="[0-9]*" id="table-${i}" data-num="${i}-table" value="${esc(x.table)}" placeholder="0" autocomplete="off"></div>
      <div class="field"><label class="flbl" for="hand-${i}">Points left in hand &amp; foot</label><span class="fsub">Both partners. Black 3s are 5.</span>
        <input type="text" class="numin" inputmode="numeric" pattern="[0-9]*" id="hand-${i}" data-num="${i}-hand" value="${esc(x.hand)}" placeholder="0" autocomplete="off"></div>
      ${stepField(i,"red3","Red 3s held",redNote(i), redOff?"off":"")}
      <div class="bd num" id="bd-${i}">${breakdown(r,i)}</div>
      <div class="warn" id="warn-${i}" ${w?"":"hidden"}>${w}</div>
    </div>`;
  }).join("");
  return `<div class="panel">
    <div class="row"><h2 class="grow">${entry.editing!=null?"Edit round":"Score round"} ${rIdx+1}</h2><button class="small ghost" data-act="cancel" id="cancel">Cancel</button></div>
    <div><div class="eyebrow" style="margin-bottom:8px">Who went out?</div><div class="chips">${chips}</div></div>
    ${panels}
    ${entry.error?`<div class="err">${esc(entry.error)}</div>`:""}
    <button class="primary" data-act="saveRound" id="saveRound">${entry.editing!=null?"Save changes":"Add round "+(rIdx+1)}</button>
    ${entry.editing!=null?`<button class="danger" data-act="delRound" id="delRound">${confirmKey==="del"?"Tap again to delete round "+(rIdx+1):"Delete this round"}</button>`:""}
  </div>`;
}
function updatePreview(){
  if (!entry) return;
  const r = entryRound();
  state.teams.forEach((_,i)=>{
    const pv = document.getElementById("pv-"+i); if (pv) pv.textContent = signed(scoreTeam(r,i).total);
    const bd = document.getElementById("bd-"+i); if (bd) bd.innerHTML = breakdown(r,i);
  });
  const err = document.querySelector(".err"); if (err) err.remove();
}

function openEntry(editIdx){
  if (editIdx != null){
    const r = state.rounds[editIdx];
    entry = { editing:editIdx, went:r.went, error:"", t:r.t.map(x=>({...x, table:String(x.table), hand:String(x.hand)})) };
  } else {
    entry = { editing:null, went:null, error:"", t:state.teams.map(()=>({clean:0,dirty:0,sevens:0,red3:0,table:"",hand:""})) };
  }
  render();
  const el = document.getElementById("went-0"); if (el) el.scrollIntoView({block:"center"});
}

document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const act = b.dataset.act;
  switch(act){
    case "count": state.setup.count = Math.min(3, Math.max(2, state.setup.count + +b.dataset.d)); save(); render(); break;
    case "start": {
      const su = state.setup;
      state.teams = su.teams.slice(0, su.count).map((t,i)=>({ name: t.name.trim() || `Team ${i+1}`, p: t.p.map((x,k)=> x.trim() || `Partner ${k+1}`) }));
      state.firstDealer = su.firstDealer; state.rounds = []; state.phase = "play"; entry = null; save(); render(); break;
    }
    case "newRound": openEntry(null); break;
    case "edit": openEntry(+b.dataset.i); break;
    case "cancel": entry = null; render(); break;
    case "went": entry.went = +b.dataset.i; entry.error = ""; render(); break;
    case "step": {
      const i = +b.dataset.t, f = b.dataset.f;
      entry.t[i][f] = Math.max(0, entry.t[i][f] + +b.dataset.d); entry.error = "";
      render(); break;
    }
    case "saveRound": {
      if (entry.went == null){ entry.error = "Choose who went out, or Nobody."; render(); break; }
      for (let i=0;i<state.teams.length;i++){
        const x = entry.t[i];
        if (!/^\d+$/.test(x.table.trim())){ entry.error = `Enter points on the table for ${teamName(state.teams,i)} (0 if none).`; render(); return; }
        if (!/^\d+$/.test(x.hand.trim())){ entry.error = `Enter points left in hand and foot for ${teamName(state.teams,i)} (0 if none).`; render(); return; }
      }
      const r = entryRound();
      if (entry.editing != null) state.rounds[entry.editing] = r; else state.rounds.push(r);
      entry = null; save(); render(); window.scrollTo({top:0}); break;
    }
    case "delRound": confirmThen("del", ()=>{ state.rounds.splice(entry.editing,1); entry = null; save(); render(); }); break;
    case "undo": confirmThen("undo", ()=>{ state.rounds.pop(); entry = null; save(); render(); }); break;
    case "rematch": state.rounds = []; entry = null; save(); render(); break;
    case "newsetup": state.phase = "setup"; state.rounds = []; entry = null; save(); render(); break;
    case "newgame": confirmThen("new", ()=>{ state.phase = "setup"; state.rounds = []; entry = null; save(); render(); }); break;
  }
});

function topOf(arr){ const m = Math.max(...arr); return { m, who: arr.map((v,i)=>i).filter(i=>arr[i]===m) }; }
function awCard(title, who, detail){ return `<div class="aw"><span class="an">${title}</span><span class="ah">${who}</span><span class="ad">${detail}</span></div>`; }
function statTable(head, rows){ return `<div class="stwrap"><table class="st"><thead><tr>${head.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`; }
const plural = (n, w) => `${n} ${w}${n===1?"":"s"}`;

function statsView(){
  const R = state.rounds, n = R.length; if (!n) return "";
  const T = state.teams, nt = T.length;
  const z = () => Array(nt).fill(0);
  const outs = z(), clean = z(), dirty = z(), sevens = z(), red = z(), won = z(), tot = z(), best = Array(nt).fill(-Infinity);
  R.forEach(r => { const sc = T.map((_,i)=>scoreTeam(r,i).total), m = Math.max(...sc);
    if (r.went >= 0) outs[r.went]++;
    T.forEach((_,i) => { const x = r.t[i], s = scoreTeam(r,i);
      clean[i]+=x.clean; dirty[i]+=x.dirty; sevens[i]+=x.sevens; if (s.red) red[i]+=x.red3;
      if (sc[i]===m) won[i]++; tot[i]+=sc[i]; best[i] = Math.max(best[i], sc[i]); }); });
  const nm = idx => idx.map(i=>esc(teamName(T,i))).join(", ");
  const books = T.map((_,i)=>clean[i]+dirty[i]+sevens[i]);

  return `<div class="panel"><h2>Stats</h2><div class="hl">

    ${awCard("Lucky 7s", s7.m?nm(s7.who):"Nobody yet", s7.m?`${plural(s7.m,"clean 7s book")}`:"No 7s books yet")}
    ${awCard("Out the door", o.m?nm(o.who):"Nobody yet", o.m?`Went out ${plural(o.m,"time")}`:"")}
    ${awCard("Red 3 pain", r3.m?nm(r3.who):"Nobody yet", r3.m?`Caught with ${plural(r3.m,"red 3")}`:"No red 3 hits")}
  </div>${statTable(["Team","Won","Out","Clean","Dirty","7s","Red 3s","Best","Avg"], T.map((_,i)=>[esc(teamName(T,i)),won[i],outs[i],clean[i],dirty[i],sevens[i],red[i],total(best[i]),total(Math.round(tot[i]/n))]))}
  <p class="hint">Won counts rounds with the higher score, ties included.</p></div>`;
}

// History adapter: how a Hand & Foot game looks to the shared history module.
const HX = {
  app: "hand-foot", title: "Hand & Foot", unit: ["round", "rounds"], sideWord: "team", lowWins: false,
  guest: n => /^(team|partner) \d+$/i.test(String(n).trim()),
  current(){
    if (state.phase !== "play" || !state.rounds.length) return null;
    const T = state.teams, R = state.rounds, done = over(), t = totals(), max = Math.max(...t);
    const sum = f => T.map((_,i) => R.reduce((a,r) => a + f(r.t[i], r, i), 0));
    return {
      sides: T.map((_,i) => ({ name: teamName(T,i), players: [playerName(T,i,0), playerName(T,i,1)] })),
      rounds: R.map(r => T.map((_,i) => scoreTeam(r,i).total)),
      done, winners: done ? t.map((_,i) => i).filter(i => t[i] === max) : undefined,
      labels: R.map((_,i) => `${i+1} · ${MELDS[i]}`),
      extra: {
        went: R.map(r => r.went),
        books: sum(x => x.clean + x.dirty + x.sevens), sevens: sum(x => x.sevens),
        red3: sum((x, r, i) => scoreTeam(r,i).red ? x.red3 : 0),
        raw: { teams: T, rounds: R, firstDealer: state.firstDealer }
      }
    };
  },
  detail(g){
    const x = g.extra; if (!x || !Array.isArray(x.went)) return "";
    const nm = i => esc(g.sides[i] ? g.sides[i].name : `Team ${i+1}`);
    const outs = x.went.map((w,i) => `Round ${i+1}: ${w >= 0 ? nm(w) + " went out" : "nobody went out"}`).join(" · ");
    const books = Array.isArray(x.books) ? g.sides.map((_,i) => `${nm(i)} ${x.books[i]} books${x.sevens && x.sevens[i] ? `, ${x.sevens[i]} of 7s` : ""}${x.red3 && x.red3[i] ? `, ${x.red3[i]} red 3${x.red3[i] === 1 ? "" : "s"}` : ""}`).join(" · ") : "";
    return `<p class="hint">${outs}</p>${books ? `<p class="hint">${books}</p>` : ""}`;
  },
  records(done){
    const out = [], rows = [];
    done.forEach(g => { const x = g.extra; if (!x || !Array.isArray(x.books)) return; g.sides.forEach((s,i) => rows.push({ g, s, books: x.books[i] || 0, sevens: (x.sevens || [])[i] || 0 })); });
    if (!rows.length) return out;
    const label = s => s.players.some(p => !HX.guest(p)) ? s.players.join(" & ") : s.name;
    const top = f => { const m = Math.max(...rows.map(r => r[f])); return { m, who: rows.filter(r => r[f] === m) }; };
    const b = top("books"), s7 = top("sevens");
    const names = w => [...new Set(w.map(r => label(r.s)))].slice(0,3).join(", ");
    const when = w => w.length === 1 ? new Date(w[0].g.date).toLocaleDateString(undefined, { month:"short", day:"numeric", year:"numeric" }) : `${w.length} times`;
    out.push(["Most books in a game", names(b.who), `${b.m} books · ${when(b.who)}`]);
    if (s7.m) out.push(["Most 7s books in a game", names(s7.who), `${s7.m} · ${when(s7.who)}`]);
    return out;
  }
};
/* ---------- game history (shared module, same in every score app) ----------
   Every game with at least one scored round is saved to localStorage as it's played, with its date,
   the teams or players, every round's scores, the final totals and the winner. A "History" screen shows
   all-time records by player name, a game log with full scorecards, and backup / restore.
   The app supplies an adapter, HX (defined just above), and this module wraps the app's save() and render(). */
const hx = (() => {
  const HKEY = HX.app + "-history-v1", BKEY = HX.app + "-last-backup";
  const unitOne = (HX.unit || ["round", "rounds"])[0], unitMany = (HX.unit || ["round", "rounds"])[1];
  const ui = { open: false, range: "all", sel: null, game: null, all: false, msg: "", confirm: null, timer: 0 };
  const e = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const num = n => (n < 0 ? "−" : "") + Math.abs(n).toLocaleString("en-US");
  const plural = (n, w, ws) => `${n} ${n === 1 ? w : (ws || w + "s")}`;
  const pkey = n => String(n || "").trim().replace(/\s+/g, " ").toLowerCase();
  const guest = n => !pkey(n) || (HX.guest ? HX.guest(n) : /^(player|partner|team|side|seat) \d+$/i.test(String(n).trim()));
  const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const whenTxt = iso => { const d = new Date(iso); return isNaN(d) ? "Unknown date" : d.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" }) + " · " + d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" }); };
  const dayTxt = iso => { const d = new Date(iso); return isNaN(d) ? "Unknown date" : d.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" }); };

  // ----- storage -----
  const valid = g => !!g && typeof g.id === "string" && Array.isArray(g.sides) && g.sides.length >= 1 && g.sides.every(s => s && typeof s.name === "string" && Array.isArray(s.players))
    && Array.isArray(g.rounds) && g.rounds.every(r => Array.isArray(r) && r.length === g.sides.length && r.every(v => typeof v === "number" && isFinite(v)));
  function load() { try { const a = JSON.parse(localStorage.getItem(HKEY) || "[]"); return Array.isArray(a) ? a.filter(valid) : []; } catch (err) { return []; } }
  let games = load();
  function persist() { try { localStorage.setItem(HKEY, JSON.stringify(games)); } catch (err) { /* storage full or blocked */ } }
  const totalsOf = g => Array.isArray(g.totals) && g.totals.length === g.sides.length ? g.totals : g.sides.map((_, i) => g.rounds.reduce((s, r) => s + r[i], 0));
  function winnersOf(g) {
    if (Array.isArray(g.winners) && g.winners.length) return g.winners;
    const t = totalsOf(g), best = g.lowWins ? Math.min(...t) : Math.max(...t);
    return t.map((_, i) => i).filter(i => t[i] === best);
  }
  const isDone = g => !!g.done;

  // ----- keep the archive in step with the current game -----
  // A game is saved as soon as its first round is scored. Starting a new game (or undoing back to nothing)
  // detaches it; a game undone to nothing after one round is dropped, anything longer stays as unfinished.
  function sync() {
    if (typeof state !== "object" || !state) return;
    let cur = null;
    try { cur = HX.current(); } catch (err) { cur = null; }
    const has = cur && Array.isArray(cur.rounds) && cur.rounds.length > 0;
    const k = state.hxId ? games.findIndex(g => g.id === state.hxId) : -1;
    if (has) {
      if (!state.hxId) state.hxId = newId();
      const prev = k >= 0 ? games[k] : null;
      const g = {
        id: state.hxId, date: prev ? prev.date : new Date().toISOString(), updated: new Date().toISOString(),
        sides: cur.sides.map(s => ({ name: String(s.name || ""), players: (s.players || []).map(String) })),
        rounds: cur.rounds.map(r => r.map(v => +v || 0)),
        totals: (cur.totals || null) && cur.totals.map(v => +v || 0),
        done: !!cur.done, winners: cur.done && Array.isArray(cur.winners) ? cur.winners.slice() : undefined,
        lowWins: !!(cur.lowWins != null ? cur.lowWins : HX.lowWins), note: cur.note || "", labels: cur.labels || undefined, extra: cur.extra || undefined
      };
      if (!g.totals) delete g.totals;
      const before = prev ? JSON.stringify(Object.assign({}, prev, { updated: 0 })) : "";
      if (before === JSON.stringify(Object.assign({}, g, { updated: 0 }))) return;
      if (k >= 0) games[k] = g; else games.push(g);
      persist();
    } else if (state.hxId) {
      // games with no game-over of their own end when the app says so (New game): the best total wins
      let ended = false;
      try { ended = typeof HX.ended === "function" && !!HX.ended(); } catch (err) { ended = false; }
      if (k >= 0 && !games[k].done && ended) {
        const g = games[k], t = g.totals || g.sides.map((_, i) => g.rounds.reduce((a, r) => a + (+r[i] || 0), 0));
        const best = g.lowWins ? Math.min(...t) : Math.max(...t);
        g.done = true; g.winners = t.map((_, i) => i).filter(i => t[i] === best); g.updated = new Date().toISOString();
        persist();
      } else if (k >= 0 && !games[k].done && games[k].rounds.length <= 1) { games.splice(k, 1); persist(); }
      state.hxId = null;
    }
  }

  // ----- stats -----
  const byDate = () => games.slice().sort((a, b) => String(a.date).localeCompare(String(b.date)));
  function inRange(g) {
    if (ui.range === "all") return true;
    const d = new Date(g.date);
    if (isNaN(d)) return false;
    if (ui.range[0] === "y") return d.getFullYear() === +ui.range.slice(1);
    return Date.now() - d <= +ui.range.slice(1) * 864e5;
  }
  const rangeLabel = () => ui.range === "all" ? "all time" : ui.range[0] === "y" ? ui.range.slice(1) : `the last ${ui.range.slice(1)} days`;
  function sideLabel(s) {
    const named = s.players.filter(p => !guest(p));
    if (s.players.length > 1) return guest(s.name) || !s.name ? (named.length ? s.players.join(" & ") : s.name || "Team") : `${s.name} (${s.players.join(" & ")})`;
    return s.players[0] || s.name;
  }
  function shortLabel(s) {
    if (s.players.length > 1) return guest(s.name) || !s.name ? s.players.join(" & ") : s.name;
    return s.players[0] || s.name;
  }
  function career(list) {
    const map = new Map(), pairs = new Map();
    list.filter(isDone).forEach(g => {
      const t = totalsOf(g), w = winnersOf(g);
      g.sides.forEach((s, i) => {
        const won = w.includes(i);
        s.players.forEach(name => {
          if (guest(name)) return;
          const k = pkey(name);
          let p = map.get(k);
          if (!p) { p = { k, name: "", gp: 0, wins: 0, shared: 0, sum: 0, best: null, worst: null, streak: 0, bestStreak: 0 }; map.set(k, p); }
          p.name = String(name).trim();
          p.gp++; p.sum += t[i];
          const better = (a, b) => g.lowWins ? a < b : a > b;
          if (p.best == null || better(t[i], p.best)) p.best = t[i];
          if (p.worst == null || better(p.worst, t[i])) p.worst = t[i];
          if (won) { p.wins++; if (w.length > 1) p.shared++; p.streak++; p.bestStreak = Math.max(p.bestStreak, p.streak); } else p.streak = 0;
        });
        const named = s.players.filter(n => !guest(n));
        if (s.players.length === 2 && named.length === 2) {
          const pk = named.map(pkey).sort().join("|");
          const r = pairs.get(pk) || { names: named.map(n => String(n).trim()).sort((a, b) => a.localeCompare(b)), gp: 0, wins: 0 };
          r.gp++; if (won) r.wins++;
          pairs.set(pk, r);
        }
      });
    });
    const players = [...map.values()].sort((a, b) => b.wins - a.wins || b.wins / b.gp - a.wins / a.gp || a.name.localeCompare(b.name));
    const teams = [...pairs.values()].sort((a, b) => b.wins - a.wins || b.gp - a.gp || a.names.join().localeCompare(b.names.join()));
    return { players, teams };
  }
  const pct = (a, b) => b ? Math.round(100 * a / b) + "%" : "–";
  const avg = (a, b) => b ? num(Math.round(a / b)) : "–";

  // ----- views -----
  function button() { return `<button class="small ghost" data-hx="open" id="hx-open" type="button">History</button>`; }
  function note() { return `<p class="hint">Saved in History with today's date.</p>`; }
  function unbacked() { let at = 0; try { at = +localStorage.getItem(BKEY) || 0; } catch (err) { /* ignore */ } return games.filter(isDone).length - at; }
  function award(t, w, d) { return `<div class="hx-award"><span class="hx-an">${t}</span><span class="hx-aw">${w}</span><span class="hx-ad">${d}</span></div>`; }

  function recordsView(done, stats) {
    if (!done.length) return "";
    const items = [];
    const scores = [], margins = [];
    done.forEach(g => {
      const t = totalsOf(g), w = winnersOf(g);
      g.sides.forEach((s, i) => scores.push({ v: t[i], who: sideLabel(s), g }));
      if (w.length === 1 && g.sides.length > 1) {
        const others = t.filter((_, i) => i !== w[0]);
        const runner = g.lowWins ? Math.min(...others) : Math.max(...others);
        margins.push({ v: Math.abs(t[w[0]] - runner), who: sideLabel(g.sides[w[0]]), g });
      }
    });
    const pick = (list, hi) => { const m = hi ? Math.max(...list.map(x => x.v)) : Math.min(...list.map(x => x.v)); return { m, who: list.filter(x => x.v === m) }; };
    const names = who => e([...new Set(who.map(x => x.who))].slice(0, 3).join(", ")) + (new Set(who.map(x => x.who)).size > 3 ? "…" : "");
    const when = who => who.length === 1 ? dayTxt(who[0].g.date) : `${who.length} times`;
    const lowWins = done.every(g => g.lowWins);
    const best = pick(scores, !lowWins), worst = pick(scores, lowWins);
    items.push(award(lowWins ? "Lowest score" : "Highest score", names(best.who), `${num(best.m)} · ${when(best.who)}`));
    items.push(award(lowWins ? "Highest score" : "Lowest score", names(worst.who), `${num(worst.m)} · ${when(worst.who)}`));
    if (margins.length) { const mg = pick(margins, true); items.push(award("Biggest win", names(mg.who), `By ${num(mg.m)} · ${when(mg.who)}`)); }
    const most = f => stats.players.length ? Math.max(...stats.players.map(p => p[f])) : 0;
    const whoOf = (m, f) => e(stats.players.filter(p => p[f] === m).map(p => p.name).slice(0, 3).join(", "));
    const mw = most("wins"), ms = most("bestStreak"), mg2 = most("gp");
    if (stats.players.length) {
      items.push(award("Most wins", mw ? whoOf(mw, "wins") : "–", plural(mw, "win")));
      items.push(award("Longest win streak", ms ? whoOf(ms, "bestStreak") : "–", `${ms} in a row`));
      items.push(award("Most games", whoOf(mg2, "gp"), plural(mg2, "game")));
    }
    if (HX.records) { try { (HX.records(done) || []).forEach(r => items.push(award(e(r[0]), e(r[1]), e(r[2])))); } catch (err) { /* adapter records are optional */ } }
    return `<div class="panel"><h2>Records</h2><div class="hx-awards">${items.join("")}</div></div>`;
  }

  function scorecard(g) {
    const t = totalsOf(g), w = winnersOf(g), run = g.sides.map(() => 0);
    const head = `<tr><th>${e(unitOne[0].toUpperCase() + unitOne.slice(1))}</th>${g.sides.map((s, i) => `<th class="${g.done && w.includes(i) ? "hx-won" : ""}">${e(shortLabel(s))}</th>`).join("")}</tr>`;
    const body = g.rounds.map((r, ri) => {
      r.forEach((v, i) => { run[i] += v; });
      const label = g.labels && g.labels[ri] ? g.labels[ri] : String(ri + 1);
      return `<tr><td>${e(label)}</td>${r.map((v, i) => `<td>${num(v)}${g.rounds.length > 1 ? `<span class="hx-run">${num(run[i])}</span>` : ""}</td>`).join("")}</tr>`;
    }).join("");
    const foot = `<tr class="hx-tot"><td>Total</td>${t.map((v, i) => `<td class="${g.done && w.includes(i) ? "hx-won" : ""}">${num(v)}</td>`).join("")}</tr>`;
    let more = "";
    if (HX.detail) { try { more = HX.detail(g) || ""; } catch (err) { more = ""; } }
    return `<div class="hx-card"><div class="stwrap hx-wrap"><table class="st hx-sc"><thead>${head}</thead><tbody>${body}${foot}</tbody></table></div>${g.rounds.length > 1 ? `<p class="hint">Small numbers are running totals.</p>` : ""}${more}</div>`;
  }

  function logView(list, sel) {
    let rows = list.slice().reverse();
    if (sel) rows = rows.filter(g => g.sides.some(s => s.players.some(n => pkey(n) === sel.k)));
    if (!rows.length) return "";
    const shown = ui.all ? rows : rows.slice(0, 10);
    const items = shown.map(g => {
      const t = totalsOf(g), w = winnersOf(g);
      const order = t.map((_, i) => i).sort((a, b) => (g.lowWins ? t[a] - t[b] : t[b] - t[a]) || a - b);
      const current = g.id === state.hxId;
      const lead = w.map(i => e(sideLabel(g.sides[i]))).join(" &amp; ");
      let status;
      if (g.done) {
        const others = t.filter((_, i) => !w.includes(i));
        const runner = others.length ? (g.lowWins ? Math.min(...others) : Math.max(...others)) : null;
        status = w.length > 1 ? `${lead} tied` : `${lead} won${runner != null ? ` by ${num(Math.abs(t[w[0]] - runner))}` : ""}`;
      } else status = `<span class="hx-tag">${current ? "In progress" : "Unfinished"}</span> after ${plural(g.rounds.length, unitOne, unitMany)}`;
      const open = ui.game === g.id, del = "del-" + g.id;
      return `<div class="hx-game">
        <div class="hx-meta"><b>${e(whenTxt(g.date))}</b><span class="hint">${status}${g.note ? ` · ${e(g.note)}` : ""}</span></div>
        <div class="hx-scores num">${order.map(i => `<span class="${g.done && w.includes(i) ? "hx-win" : ""}">${e(sideLabel(g.sides[i]))} <b>${num(t[i])}</b></span>`).join(" · ")}</div>
        <div class="btnrow hx-btns"><button class="small" type="button" data-hx="game" data-id="${e(g.id)}" id="hx-g-${e(g.id)}">${open ? "Hide scorecard" : "Scorecard"}</button><button class="small" type="button" data-hx="sres" data-id="${e(g.id)}" id="hx-s-${e(g.id)}">${ui.copied === g.id ? "Copied ✓" : "Share"}</button>${current ? "" : `<button class="small danger" type="button" data-hx="del" data-id="${e(g.id)}" id="hx-d-${e(g.id)}">${ui.confirm === del ? "Tap to delete" : "Delete"}</button>`}</div>
        ${open ? scorecard(g) : ""}
      </div>`;
    }).join("");
    return `<div class="panel"><h2>${sel ? `${e(sel.name)}'s games` : "Game log"}</h2><div class="hx-log">${items}</div>
      ${rows.length > 10 ? `<button class="small" type="button" data-hx="all" id="hx-all">${ui.all ? "Show fewer" : `Show all ${rows.length} games`}</button>` : ""}</div>`;
  }

  function backupView() {
    return `<div class="panel"><h2>Backup &amp; share</h2>
      <p class="hint">History is stored on this phone only. Clearing site data or switching phones loses it, so back it up now and then.</p>
      <p class="hint">To combine two phones' history, share the backup to the other phone and tap Restore there. Games it already has are skipped.</p>
      <div class="btnrow"><button type="button" data-hx="share" id="hx-share" ${games.length ? "" : "disabled"}>Share backup</button><button type="button" data-hx="download" id="hx-download" ${games.length ? "" : "disabled"}>Download</button><button type="button" data-hx="restore" id="hx-restore">Restore</button></div>
      <input type="file" id="hx-file" accept=".json,application/json" hidden>
      ${ui.msg ? `<p class="hint" role="status">${e(ui.msg)}</p>` : ""}</div>`;
  }

  function view() {
    const back = `<button class="small ghost" type="button" data-hx="back" id="hx-back">Back</button>`;
    const top = `<div class="hx-top"><div><div class="eyebrow">${e(HX.title)}</div><h1>History</h1></div>${back}</div>`;
    if (!games.length) return `<div class="hx">${top}<div class="panel"><h2>No games yet</h2><p class="hint">Every game is saved here as you play, with the date, the ${HX.sideWord || "team"}s and every ${unitOne}'s score.</p></div>${moveView()}${backupView()}</div>`;
    const list = byDate().filter(inRange), stats = career(list), done = list.filter(isDone);
    const sel = ui.sel && stats.players.find(p => p.k === ui.sel);
    const years = [...new Set(games.map(g => new Date(g.date).getFullYear()).filter(y => !isNaN(y)))].sort((a, b) => b - a);
    const opt = (v, l) => `<option value="${v}" ${ui.range === v ? "selected" : ""}>${l}</option>`;
    const range = `<div class="row"><label class="eyebrow" for="hx-range">Showing</label><select id="hx-range" class="grow">${opt("all", "All time")}${opt("d30", "Last 30 days")}${opt("d90", "Last 90 days")}${years.map(y => opt("y" + y, y)).join("")}</select></div>`;
    const nudge = unbacked() >= 5 ? `<div class="hx-nudge"><span class="grow">${plural(unbacked(), "finished game")} since your last backup.</span><button class="small" type="button" data-hx="download" id="hx-nudge">Back up now</button></div>` : "";
    let body;
    if (sel) {
      body = `<div class="panel"><div class="row"><h2 class="grow">${e(sel.name)}</h2><button class="small" type="button" data-hx="player" data-k="" id="hx-everyone">Everyone</button></div>
        <div class="hx-awards">${award("Games", sel.gp, `in ${rangeLabel()}`)}${award("Wins", sel.wins, `${pct(sel.wins, sel.gp)} of games${sel.shared ? `, ${sel.shared} shared` : ""}`)}${award(done.every(g => g.lowWins) ? "Best (lowest)" : "Best score", sel.best == null ? "–" : num(sel.best), "single game")}${award("Average", avg(sel.sum, sel.gp), "per game")}${award("Best streak", sel.bestStreak, "wins in a row")}</div></div>`;
    } else if (!done.length) {
      body = `<div class="panel"><h2>All-time records</h2><p class="hint">No finished games in ${rangeLabel()} yet. Unfinished games are listed below.</p></div>`;
    } else {
      const pl = stats.players, tm = stats.teams;
      body = `<div class="panel"><div><h2>Players</h2><p class="hint">${plural(done.length, "finished game")} in ${rangeLabel()}. Tap a name for their record and games.</p></div>
        ${pl.length ? `<div class="stwrap"><table class="st"><thead><tr><th>Player</th><th>GP</th><th>Wins</th><th>Win %</th><th>Avg</th><th>Best</th></tr></thead><tbody>
          ${pl.map(p => `<tr><td><button class="hx-link" type="button" data-hx="player" data-k="${e(p.k)}">${e(p.name)}</button></td><td>${p.gp}</td><td>${p.wins}</td><td>${pct(p.wins, p.gp)}</td><td>${avg(p.sum, p.gp)}</td><td>${p.best == null ? "–" : num(p.best)}</td></tr>`).join("")}
        </tbody></table></div><p class="hint">GP: games played. Wins include ties. Avg and Best are ${HX.sideWord === "player" ? "the player's" : "the team's"} final score.</p>`
        : `<p class="hint">Only unnamed players so far. Name everyone at the start of a game to track them here.</p>`}</div>
        ${tm.length ? `<div class="panel"><h2>Partnerships</h2><div class="stwrap"><table class="st"><thead><tr><th>Pair</th><th>GP</th><th>Wins</th><th>Win %</th></tr></thead><tbody>${tm.map(r => `<tr><td>${e(r.names.join(" & "))}</td><td>${r.gp}</td><td>${r.wins}</td><td>${pct(r.wins, r.gp)}</td></tr>`).join("")}</tbody></table></div></div>` : ""}
        ${recordsView(done, stats)}`;
    }
    return `<div class="hx">${top}${nudge}${range}${body}${logView(list, sel)}${backupView()}${moveView()}</div>`;
  }

  // ----- backup -----
  function file() {
    const data = JSON.stringify({ app: HX.app, version: 1, exported: new Date().toISOString(), games }, null, 2);
    return new File([data], `${HX.app}-history-${new Date().toISOString().slice(0, 10)}.json`, { type: "application/json" });
  }
  function marked() { try { localStorage.setItem(BKEY, String(games.filter(isDone).length)); } catch (err) { /* ignore */ } }
  function download() {
    const f = file(), a = document.createElement("a");
    a.href = URL.createObjectURL(f); a.download = f.name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    marked(); ui.msg = `Downloaded ${f.name}.`;
  }
  async function share() {
    const f = file();
    if (navigator.canShare && navigator.canShare({ files: [f] })) {
      try { await navigator.share({ files: [f], title: `${HX.title} history` }); marked(); ui.msg = "Backup shared."; }
      catch (err) { if (err.name !== "AbortError") ui.msg = "Couldn't share. Try Download instead."; }
    } else { download(); ui.msg += " This browser can't share files, so it was downloaded instead."; }
  }
  function restore(text) {
    let data;
    try { data = JSON.parse(text); } catch (err) { ui.msg = `That file isn't a ${HX.title} backup.`; return; }
    if (data && data.kind === BUNDLE && data.apps) data = Array.isArray(data.apps[HX.app]) ? data.apps[HX.app] : [];
    const list = Array.isArray(data) ? data : data && Array.isArray(data.games) && (!data.app || data.app === HX.app) ? data.games : null;
    if (!list) { ui.msg = `That file isn't a ${HX.title} backup.`; return; }
    ui.msg = merge(list);
  }
  // Adds games this phone doesn't have; a game it has is replaced only by a more complete copy (never the one being played).
  function merge(list) {
    let added = 0, updated = 0, skipped = 0, bad = 0;
    list.forEach(g => {
      if (!valid(g)) { bad++; return; }
      const k = games.findIndex(x => x.id === g.id);
      const copy = JSON.parse(JSON.stringify(g));
      if (isNaN(new Date(copy.date))) copy.date = new Date().toISOString();
      if (k < 0) { games.push(copy); added++; }
      else if (g.id !== state.hxId && (g.done && !games[k].done || g.rounds.length > games[k].rounds.length)) { games[k] = copy; updated++; }
      else skipped++;
    });
    persist();
    return `Added ${plural(added, "game")}.` + (updated ? ` Updated ${updated}.` : "") + (skipped ? ` ${skipped} already here.` : "") + (bad ? ` ${bad} unreadable.` : "");
  }

  // ----- moving History into a Home Screen icon -----
  // On iPhone an app opened from a Home Screen icon keeps its own storage, separate from Safari. All the card apps
  // share Safari's storage, so one Copy there carries every card game's history; Paste in an icon takes this game's part.
  const BUNDLE = "card-games-history";
  const CARD_APPS = ["hand-foot", "hearts", "skyjo", "cribbage", "spades", "euchre", "pitch", "casino", "flip7", "up-down-river", "presidents", "mao", "card-golf"];
  const iOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (/Macintosh/.test(navigator.userAgent) && navigator.maxTouchPoints > 1);
  const standalone = () => navigator.standalone === true || !!(window.matchMedia && matchMedia("(display-mode: standalone)").matches);
  const here = () => (location.host + location.pathname).replace(/index\.html$/, "");
  function bundle() {
    const apps = {}; let n = 0, k = 0;
    CARD_APPS.forEach(id => {
      let a = [];
      try { a = JSON.parse(localStorage.getItem(id + "-history-v1") || "[]"); } catch (err) { a = []; }
      if (Array.isArray(a) && a.length) { apps[id] = a; n += a.length; k++; }
    });
    return { text: JSON.stringify({ kind: BUNDLE, version: 1, exported: new Date().toISOString(), apps }), games: n, apps: k };
  }
  async function copyText(text) {
    try { await navigator.clipboard.writeText(text); return true; } catch (err) { /* older browsers: copy from a hidden box */ }
    const t = document.createElement("textarea");
    t.value = text; t.setAttribute("readonly", ""); t.style.cssText = "position:fixed;top:0;left:0;opacity:0";
    document.body.appendChild(t); t.select(); t.setSelectionRange(0, text.length);
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (err) { ok = false; }
    t.remove();
    return ok;
  }
  async function copyAll() {
    const b = bundle(), app = standalone();
    if (!b.games) { ui.mmsg = app ? "There are no games in this app's History yet." : "No card game History is saved in Safari on this phone. If you play from a game's own Home Screen icon, its History is in that icon: open it, tap History, then Copy History."; return; }
    ui.mmsg = await copyText(b.text)
      ? app ? `Copied ${plural(b.games, "game")}. Now open Card Night or the other Home Screen icon and tap Paste History.`
        : `Copied ${plural(b.games, "game")} from ${plural(b.apps, "card app")}. Now open the Home Screen icon or Card Night and tap Paste History.`
      : "Couldn't copy on this browser. Use Share backup instead, then Restore in the other app.";
  }
  async function pasteFromSafari() {
    let text = "";
    try { text = await navigator.clipboard.readText(); } catch (err) { text = ""; }
    if (!text) { ui.pasteBox = true; ui.mmsg = "Long-press the box, tap Paste, then tap Add games."; return; }
    take(text);
  }
  function take(text) {
    let data = null;
    try { data = JSON.parse(text); } catch (err) { data = null; }
    if (data && data.kind === BUNDLE && data.apps && typeof data.apps === "object") {
      const list = data.apps[HX.app];
      ui.pasteBox = false;
      ui.mmsg = Array.isArray(list) && list.length ? merge(list) : `What you copied has no ${HX.title} games.`;
    } else if (data && (data.app === HX.app || Array.isArray(data)) && (Array.isArray(data) || Array.isArray(data.games))) {
      ui.pasteBox = false; ui.mmsg = merge(Array.isArray(data) ? data : data.games);
    } else ui.mmsg = "That isn't card game history. Copy it first: in Safari, History → Copy for Home Screen; in another Home Screen icon, History → Copy History.";
  }
  function moveView() {
    if (!iOS) return "";
    const msg = ui.mmsg ? `<p class="hint" role="status">${e(ui.mmsg)}</p>` : "";
    if (!standalone()) return `<div class="panel"><h2>Home Screen icon</h2>
      <p class="hint">An app opened from a Home Screen icon keeps its own History, separate from Safari. To bring your games over, tap Copy here, then open the Home Screen icon or Card Night and tap Paste History. One Copy carries every card game's history.</p>
      <div class="btnrow"><button type="button" data-hx="mcopy" id="hx-mcopy">Copy for Home Screen</button></div>${msg}</div>`;
    return `<div class="panel"><h2>Move History</h2>
      <p class="hint">This Home Screen app keeps its own History, separate from Safari and from other Home Screen icons.</p>
      <p class="hint">To move these games into Card Night or another icon, tap Copy History, then open it there and tap Paste History.</p>
      <p class="hint">To bring in games you played in Safari, open ${e(here())} in Safari, tap History, then Copy for Home Screen. Then come back here and tap Paste History.</p>
      <div class="btnrow"><button type="button" data-hx="mcopy" id="hx-mcopy">Copy History</button><button type="button" data-hx="mpaste" id="hx-mpaste">Paste History</button></div>
      ${ui.pasteBox ? `<textarea id="hx-mtext" class="hx-paste" rows="3" placeholder="Long-press here and tap Paste" aria-label="Copied history"></textarea><div class="btnrow"><button type="button" data-hx="mpaste2" id="hx-mpaste2">Add games</button></div>` : ""}${msg}</div>`;
  }

  // ----- sharing a result as text (group chats) -----
  function resultText(g) {
    const t = totalsOf(g), w = g.done ? winnersOf(g) : [];
    const better = (a, b) => g.lowWins ? a < b : a > b;
    const order = t.map((_, i) => i).sort((a, b) => (g.lowWins ? t[a] - t[b] : t[b] - t[a]) || a - b);
    const rest = order.filter(i => !w.includes(i));
    const lines = [`${HX.title} · ${dayTxt(g.date)}`];
    if (!g.done) lines.push(`Standings after ${plural(g.rounds.length, unitOne, unitMany)}`);
    order.filter(i => w.includes(i)).forEach(i => lines.push(`🏆 ${sideLabel(g.sides[i])} ${num(t[i])}`));
    rest.forEach(i => {
      const pos = w.length + 1 + rest.filter(j => better(t[j], t[i])).length, tied = rest.some(j => j !== i && t[j] === t[i]);
      lines.push(`${tied ? "T" : ""}${pos}. ${sideLabel(g.sides[i])} ${num(t[i])}`);
    });
    const foot = [g.done ? plural(g.rounds.length, unitOne, unitMany) : "", g.note || ""].filter(Boolean).join(" · ");
    if (foot) lines.push(foot);
    const solo = w.length === 1 && g.sides[w[0]].players.length === 1 ? g.sides[w[0]].players[0] : "";
    if (solo && !guest(solo)) {
      const p = career(byDate().filter(x => String(x.date) <= String(g.date))).players.find(x => x.k === pkey(solo));
      if (p && p.streak >= 2) lines.push(`🔥 ${p.name} has won ${p.streak} in a row`);
    }
    return lines.join("\n");
  }
  async function shareResult(id) {
    const g = games.find(x => x.id === id); if (!g) return;
    const text = resultText(g);
    if (navigator.share) {
      try { await navigator.share({ text }); return; } catch (err) { if (err.name === "AbortError") return; }
    }
    if (!(await copyText(text))) return;
    ui.copied = id; render();
    setTimeout(() => { if (ui.copied === id) { ui.copied = null; render(); } }, 3000);
  }
  function shareButton(label, cls) {
    const id = state.hxId;
    if (!id || !games.some(g => g.id === id)) return "";
    return `<button class="${cls || "small"}" type="button" data-hx="sres" data-id="${e(id)}" id="hx-sres">${ui.copied === id ? "Copied ✓" : e(label || "Share result")}</button>`;
  }
  function saved() { return `<div class="hx-saved"><span style="opacity:.9">This game is saved in History.</span>${shareButton()}</div>`; }

  // ----- events -----
  function confirmThen(key, fn) {
    if (ui.confirm === key) { clearTimeout(ui.timer); ui.confirm = null; fn(); return; }
    ui.confirm = key; render();
    clearTimeout(ui.timer);
    ui.timer = setTimeout(() => { ui.confirm = null; if (ui.open) render(); }, 3500);
  }
  document.addEventListener("click", ev => {
    const b = ev.target.closest("[data-hx]"); if (!b) return;
    const a = b.dataset.hx;
    if (a === "open") { ui.open = true; ui.msg = ""; render(); window.scrollTo(0, 0); }
    else if (a === "back") { ui.open = false; ui.sel = null; ui.game = null; render(); window.scrollTo(0, 0); }
    else if (a === "game") { ui.game = ui.game === b.dataset.id ? null : b.dataset.id; render(); }
    else if (a === "del") confirmThen("del-" + b.dataset.id, () => { games = games.filter(g => g.id !== b.dataset.id); persist(); render(); });
    else if (a === "all") { ui.all = !ui.all; render(); }
    else if (a === "player") { ui.sel = b.dataset.k || null; ui.all = false; render(); window.scrollTo(0, 0); }
    else if (a === "download") { download(); render(); }
    else if (a === "share") share().then(render);
    else if (a === "restore") { const f = document.getElementById("hx-file"); if (f) f.click(); }
    else if (a === "sres") shareResult(b.dataset.id);
    else if (a === "mcopy") copyAll().then(render);
    else if (a === "mpaste") pasteFromSafari().then(render);
    else if (a === "mpaste2") { const t = document.getElementById("hx-mtext"); take(t ? t.value : ""); render(); }
  });
  document.addEventListener("change", ev => {
    if (ev.target.id === "hx-range") { ui.range = ev.target.value; ui.sel = null; render(); }
    if (ev.target.id === "hx-file" && ev.target.files && ev.target.files[0]) ev.target.files[0].text().then(restore, () => { ui.msg = "Couldn't read that file."; }).then(render);
  });

  return { sync, view, button, note, saved, shareButton, isOpen: () => ui.open, games: () => games };
})();
// Wrap the app's own save() and render(): every save keeps the archive current, and History takes over the screen while open.
{
  const appSave = save, appRender = render;
  save = function () { hx.sync(); return appSave.apply(this, arguments); };
  render = function () {
    if (hx.isOpen()) { document.getElementById("app").innerHTML = hx.view(); return; }
    return appRender.apply(this, arguments);
  };
}
// A game already on this phone when History arrived is saved right away (dated now).
hx.sync(); save();
/* hx:js:end */
render();
</script>

try { if (navigator.storage && navigator.storage.persist && !localStorage.getItem("cards-hand-foot-persist")) { localStorage.setItem("cards-hand-foot-persist", "1"); navigator.storage.persist(); } } catch (e) {}
